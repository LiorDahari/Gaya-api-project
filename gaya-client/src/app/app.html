<h1>מחשבון גאיה</h1>

<div class="calculator-container">

  <div>
    <label>ערך ראשון:</label>
    <input [(ngModel)]="fieldA">
  </div>

  <div>
    <label>ערך שני:</label>
    <input [(ngModel)]="fieldB">
  </div>

  <div>
    <label>בחר פעולה:</label>
    <select [(ngModel)]="selectedOperationId">
      <option [ngValue]="null" disabled selected>בחר פעולה...</option>
      <option *ngFor="let op of operations" [value]="op.id">
        {{ op.name }}
      </option>
    </select>
  </div>

  <button (click)="calculate()">חשב</button>

  <div class="result">
    תוצאה: {{ result }}
  </div>
  <div>
    <label class="history-label">הסטוריית חישובים</label>
      <table>
        <thead>
          <tr>
            <th>ערך א</th>
            <th>ערך ב</th>
            <th>תוצאה</th>
            <th>תאריך</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of lastHistory">
            <td>{{ item.valueA }}</td>
            <td>{{ item.valueB }}</td>
            <td>{{ item.result }}</td>
            <td>{{ item.createdAt | date:'dd/MM/yyyy HH:mm' }}</td> 
          </tr>
        </tbody>
      </table>
  </div>
</div>

<router-outlet />
